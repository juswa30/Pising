<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zalamea Login Copy</title>
  <style>
    body {
      margin: 0;
      background: #1e2a38;
      font-family: Arial, sans-serif;
    }
    .wrapper {
      max-width: 480px;
      margin: 40px auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
    }
    .logo {
      text-align: left;
margin-bottom: 20px;
    }
    .logo img {
      height: 60px;
    }
    h2 {
      margin: 0;
      margin-bottom: 4px;
      color: #333;
      font-weight: 600;
    }
    .subtext {
      color: #555;
      font-size: 14px;
      margin-bottom: 18px;
    }
    label {
      font-size: 14px;
      margin-bottom: 4px;
      display: block;
      color: #444;
    }
    .input-box {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .forgot {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .forgot a {
      color: #0a4fa3;
      font-size: 13px;
    }
    .btn-main {
      width: 100%;
      background: #0b2d48;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 3px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .signinwith {
      text-align: center;
      color: #15803d;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .btn-okta {
      width: 100%;
      background: #f18b18;
      border: none;
      padding: 12px;
      border-radius: 3px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .register-text {
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #15803d;
    }
    .btn-register {
      width: 100%;
      background: #0a75ff;
      border: none;
      padding: 12px;
      border-radius: 3px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .privacy {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 18px;
    }
    .privacy a {
      color: #0a4fa3;
    }
    .version {
      text-align: center;
      color: #ccc;
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="logo">
      <img src="zal-logo.png" alt="Logo" />
    </div>

    <h2>Sign In</h2>
    <div class="subtext">Login to access your account.</div>

    <label>Email Address</label>
    <input type="text" class="input-box" />

    <label>Password</label>
    <input type="password" class="input-box" />

    <div class="forgot"><a href="#">Forgot Your Password?</a></div>

    <button class="btn-main">SIGN IN</button>

    <div class="signinwith">or sign in with</div>

    <button class="btn-okta">Okta</button>

    <div class="register-text">Don't have an account?</div>
    <button class="btn-register">Register</button>

    <div class="privacy">
      Registering or Logging In to Employee Portal is a confirmation of your<br>
      agreement to our <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <div class="version">version 4.0.0</div>

</body>
</html>
